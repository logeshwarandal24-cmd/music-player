<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">
    <img src="https://via.placeholder.com/250" alt="Album Art">
    <h2>Song Title</h2>
    <p>Artist Name</p>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="controls">
        <button>⏮</button>
        <button class="play">▶</button>
        <button>⏭</button>
    </div>
</div>

</body>
</html>
